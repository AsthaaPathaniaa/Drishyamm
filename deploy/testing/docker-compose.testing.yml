# Testing-server overlay: single HTTPS origin through a Cloudflare Tunnel.
#
# Enabled on the testing server only, through its (gitignored) root .env:
#   COMPOSE_FILE=docker-compose.yml:deploy/testing/docker-compose.testing.yml
# so every plain `docker compose ...` (and scripts/deploy.sh) includes it.
#
# A Cloudflare Tunnel (systemd service `cloudflared`, managed in the Cloudflare
# dashboard) publishes 127.0.0.1:8080 as the testing URL. Tailscale Funnel was
# used until 2026-11-24. See docs/DEPLOYMENT.md.
#
# Values come from the root .env (TEST_ORIGIN is the testing URL, no trailing slash):
#   PUBLIC_API_URL=${TEST_ORIGIN}            PUBLIC_APP_URL=${TEST_ORIGIN}
#   PUBLIC_HLS_URL=${TEST_ORIGIN}/hls        PUBLIC_WEBRTC_URL=${TEST_ORIGIN}/live
#   PUBLIC_AI_URL=${TEST_ORIGIN}/ai          PUBLIC_WHEP_BASE=${TEST_ORIGIN}
#   CORS_ORIGINS=${TEST_ORIGIN},http://localhost:5173
#   VITE_ALLOWED_HOSTS=<testing hostname>
#   HOST_IP=<LAN IP>[,<tailscale 100.x IP>]  (WebRTC ICE candidates)

services:
  edge:
    image: nginx:1.27-alpine
    container_name: drishyam-edge
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"     # loopback only; the Cloudflare Tunnel is the way in
    volumes:
      - ./deploy/testing/nginx.conf:/etc/nginx/nginx.conf:ro
      # The console's production build (frontend/dist, made by deploy.sh) and
      # public/. The directory is mounted, not dist itself, so the swap of a
      # new build into place is seen without recreating the edge.
      - ./frontend:/srv/frontend:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/edge-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      smart-cam-backend:
        condition: service_started
      smart-cam-app:
        condition: service_started

  smart-cam-app:
    environment:
      # Browser-facing bases (see frontend/src/core/config/endpoints.js).
      VITE_AI_BASE_URL: ${PUBLIC_AI_URL:-http://localhost:8001}
      # WHEP base is the ORIGIN: the backend's webrtcUrl already carries /live/<path>.
      VITE_STREAM_SERVICE_WEBRTC_BASE: ${PUBLIC_WHEP_BASE:-http://localhost:8889}
      # Vite 7 rejects unknown Host headers; allow the testing hostname.
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
