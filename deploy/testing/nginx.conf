# Testing-server edge: ONE origin for the whole stack.
#
#   Cloudflare Tunnel (HTTPS, systemd `cloudflared`) ──▶ 127.0.0.1:8080 ──▶ this nginx ──▶ services
#
# Paths:
#   /            → frontend/dist (production build made by scripts/deploy.sh);
#                  falls back to smart-cam-app:5173 (Vite dev server) when no
#                  build exists
#   /api/        → smart-cam-backend:5000 (REST + /api/stream/live relay WebSocket)
#   /socket.io/  → smart-cam-backend:5000 (Socket.IO)
#   /ai/         → smart-cam-ai:8001/     (prefix stripped; REST, MJPEG, /ws)
#   /hls/        → stream-service:8888/   (prefix stripped)
#   /live/       → stream-service:8889/   (WHEP signalling; prefix stripped)
#
# WebRTC media itself (UDP 8189) does not pass through here or the tunnel:
# only browsers that can reach HOST_IP (.env) directly get it; others use /hls/.
#
# Production uses deploy/nginx/nginx.conf, which is a different file on purpose.
# This one is deliberately simple: no TLS (the tunnel terminates it), no
# rate limits, no stream auth sub-request.

worker_processes auto;
events { worker_connections 4096; }

http {
    # Docker's DNS. Upstreams are resolved per request (variables below), so a
    # recreated container with a new IP doesn't leave nginx pointing at the old one,
    # and nginx starts even if a service is still down.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Who is asking? ───────────────────────────────────────────────────────
    # Left from the Tailscale era (Funnel off since 2026-11-24): tailscale serve
    # added Tailscale-User-Login for signed-in tailnet users. Through the
    # Cloudflare Tunnel the header is never set, so every request logs public=1.
    # Fails closed.
    map $http_tailscale_user_login $is_public {
        ""      1;
        default 0;
    }
    # Real client IP for the backend (rate limits, audit logs). cloudflared
    # sets X-Forwarded-For to the true client address; Express (`trust proxy 1`)
    # takes the last entry, so pass that header through instead of
    # appending nginx's own peer (the Docker gateway).
    map $http_x_forwarded_for $client_xff {
        ""      $remote_addr;
        default $http_x_forwarded_for;
    }

    # File types for what the edge serves itself (the console build). Without
    # them every file goes out as text/plain, and browsers refuse to run a
    # module script with that type.
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;

    # Compress text. The Vite dev server sends the app uncompressed: measured
    # 2026-11-18 through Funnel, the login page was 75 requests / 5.5 MB at
    # ~250 KB/s (17-24 s); gzipped it is 1.1 MB. Only text types are listed, so
    # video (HLS segments, MJPEG multipart, fMP4 over WebSocket) and SSE pass
    # through untouched; WebSocket upgrades are never compressed by nginx.
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;              # every response here is proxied
    gzip_vary         on;
    gzip_types        text/css text/javascript application/javascript
                      application/json application/manifest+json
                      image/svg+xml text/plain text/xml application/xml;
    client_max_body_size 512m;          # face enrolment / video uploads
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $client_xff;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout  3600s;          # sockets, MJPEG and long polls
    proxy_send_timeout  3600s;
    proxy_buffering off;                # MJPEG / live streams must not buffer

    log_format edge '$time_iso8601 client=$client_xff public=$is_public '
                    '"$request" $status $body_bytes_sent ${request_time}s';
    access_log /dev/stdout edge;
    error_log  /dev/stderr warn;

    server {
        listen 80 default_server;
        server_name _;
        absolute_redirect off;          # keep Location relative: TLS ends at the tunnel

        set $app     smart-cam-app:5173;
        set $backend smart-cam-backend:5000;
        set $ai      smart-cam-ai:8001;
        set $headcount head-count:8000;
        set $hls     stream-service:8888;
        set $whep    stream-service:8889;

        location = /edge-health { return 200 "ok\n"; }

        location /api/ {
            proxy_pass http://$backend;
        }

        location /socket.io/ {
            proxy_pass http://$backend;
        }

        location /ai/ {
            rewrite ^/ai/(.*)$ /$1 break;
            proxy_pass http://$ai;
        }

        # The head-count service, which the Head Count and Occupancy pages call
        # DIRECTLY rather than through the backend (useOccupancy.js picks
        # `/headcount` for any host that is not localhost). Without this block
        # the request fell through to the SPA catch-all below, the browser was
        # handed index.html, r.json() threw on the first angle bracket, and the
        # page reported a healthy service as "not responding".
        #
        # Port 8000 is the port INSIDE the compose network. 8020 is where the
        # container publishes it on the host, and is not reachable from here.
        #
        # /headcount/video/<monitorId> is an MJPEG stream that never ends, so
        # it needs unbuffered proxying and a long read timeout. Both are
        # already set once at http level in this file (proxy_buffering off,
        # proxy_read_timeout 3600s), which is why this block does not restate
        # them -- that is this file's convention and moving it here would hide
        # where they come from.
        location /headcount/ {
            rewrite ^/headcount/(.*)$ /$1 break;
            proxy_pass http://$headcount;
        }

        location /hls/ {
            rewrite ^/hls/(.*)$ /$1 break;
            proxy_pass http://$hls;
            proxy_redirect / /hls/;     # MediaMTX redirects (cookieCheck) are root-relative
        }

        location /live/ {
            rewrite ^/live/(.*)$ /$1 break;
            proxy_pass http://$whep;
            proxy_redirect / /live/;    # WHEP session Location header is root-relative
        }

        # ── Operator console ────────────────────────────────────────────────
        # Served from the production build that scripts/deploy.sh makes
        # (frontend/dist, mounted at /srv/frontend). Measured 2026-11-18
        # through Funnel, the Vite dev server cost 75 requests / 1.1 MB
        # gzipped for the login page and ~10 s, almost all of it per-request
        # round trips. With no build present (fresh checkout, deploy.sh not
        # run yet) everything falls through to the dev server, as before.

        # Hashed build files never change under the same name: cache for good,
        # serve the .gz the build already wrote.
        # A tab opened before a deploy still asks for the previous build's
        # chunks (lazy routes): keep serving those from dist.prev. Missing is a
        # real 404, never the SPA page (a module script must not get HTML).
        location /assets/ {
            root /srv/frontend;
            gzip_static on;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files /dist$uri /dist.prev$uri =404;
        }

        # Everything else: a built file, then public/ (served in place, not
        # copied into every build: it holds the LFS demo videos), then the SPA
        # entry for client-side routes, else the dev server. index.html is
        # revalidated every time so a deploy shows up on the next load.
        location / {
            root /srv/frontend;
            add_header Cache-Control "no-cache";
            try_files /dist$uri /public$uri /dist/index.html @vite;
        }

        # The console's own "Watch live" page is /live, which collides with
        # the WHEP prefix above: nginx answered /live with a 301 to /live/ and
        # the stream service then 404'd, so opening, reloading or bookmarking
        # Watch live failed (in-app navigation worked). An exact match wins
        # over the prefix; WHEP paths (/live/<path>/whep) are unaffected.
        location = /live {
            root /srv/frontend;
            add_header Cache-Control "no-cache";
            try_files /dist/index.html @vite;
        }

        location @vite {
            proxy_pass http://$app;
        }
    }
}
