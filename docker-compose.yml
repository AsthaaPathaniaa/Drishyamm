# Drishyam: the full stack (VMS + AI). Runs on any Docker host, GPU or not.
#
# GPUs are add-ons, picked per host by scripts/gpu-addon.sh (deploy.sh runs it
# on every deploy; run it once on a new machine), which sets COMPOSE_FILE in .env:
#   docker-compose.nvidia.yml   NVIDIA GPU (+ NVIDIA Container Toolkit): AI on the
#                               GPU, NVENC for live H.265 -> H.264 transcodes
#   docker-compose.vaapi.yml    Intel/AMD graphics on Linux: VAAPI transcodes
#   (neither)                   AI on the CPU (slow), transcodes on the CPU
# e.g. COMPOSE_FILE=docker-compose.yml:docker-compose.nvidia.yml
# Never rename services: code and env refer to them. See docs/DEPLOYMENT.md.
x-ai-env: &id001
  BACKEND_URL: http://smart-cam-backend:5000
  SERVICE_TOKEN: ${SERVICE_TOKEN}
  VMS_JWT_SECRET: ${SERVICE_TOKEN}
  VMS_CAMERA_CRED_KEY: ${VMS_CAMERA_CRED_KEY:-}
  LEGACY_API_KEY: ${LEGACY_API_KEY:-}
  VMS_ENV: ${VMS_ENV:-dev}
  VMS_JWT_DEV_BYPASS: ${VMS_JWT_DEV_BYPASS:-true}
  MEDIAMTX_RTSP_HOST: mediamtx
  MEDIAMTX_RTSP_PORT: 8554
  MEDIAMTX_RTSP_TEMPLATE: rtsp://{host}:{port}/cam_{monitor_id}
  PORT: 8001
  API_PORT: 8001
  POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-vms}:${POSTGRES_PASSWORD:-vms}@postgres:5432/vms_face
  POSTGRES_DSN_SYNC: postgresql+psycopg2://${POSTGRES_USER:-vms}:${POSTGRES_PASSWORD:-vms}@postgres:5432/vms_face
  QDRANT_URL: http://qdrant:6333
  QDRANT_API_KEY: ${QDRANT_API_KEY:-}
  REDIS_URL: redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379/0
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  MINIO_BUCKET_OUTPUT: vms-person-tracker
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  RECORDINGS_ROOT: /recordings
  TZ: ${TZ:-Asia/Kolkata}
  KNOWN_FACES_DIR: /srv/data/known_faces
  DEFAULT_TENANT_NAME: ${AI_DEFAULT_TENANT_NAME:-drisyam-default}
  INSIGHTFACE_MODEL: buffalo_l
  INSIGHTFACE_DET_SIZE: 960
  INSIGHTFACE_CTX_ID: 0
  INSIGHTFACE_PROVIDERS: CUDAExecutionProvider,CPUExecutionProvider
  INSIGHTFACE_DET_THRESHOLD: '0.5'
  INSIGHTFACE_REC_THRESHOLD: '0.45'
  RECOGNIZER_BACKEND: insightface_batched
  PIPELINE_BATCHED_INFERENCE: 'true'
  INSIGHTFACE_DET_ASPECT: '1.7778'
  DETECT_EVERY_N_FRAMES: '2'
  MOTION_GATE_ENABLED: 'true'
  MATCH_MIN_FACE_PX: '15'
  MATCH_MIN_QUALITY: '0.25'
  MATCH_MIN_BLUR_VAR: '8.0'
  TRACK_MIN_HITS_TO_MATCH: '2'
  FACE_LEARNING_MIN_SIMILARITY: '0.50'
  FACE_LEARNING_MIN_QUALITY: '0.45'
  FACE_LEARNING_MIN_FACE_PX: '60'
  FACE_LEARNING_MIN_BLUR_VAR: '20.0'
  JOURNEY_BODY_LOGGING: 'true'
  PIPELINE_PERSON_DETECTION_ENABLED: ${PIPELINE_PERSON_DETECTION_ENABLED:-false}
  PIPELINE_PERSON_MODEL_PATH: /srv/data/person-models/yolov8n.onnx
  PIPELINE_PERSON_THRESHOLD: '0.35'
  PIPELINE_PERSON_DET_SIZE: '640'
  PIPELINE_PERSON_DETECT_EVERY_N_FRAMES: ${PIPELINE_PERSON_DETECT_EVERY_N_FRAMES:-2}
  INVESTIGATE_MEASURE_ENABLED: ${INVESTIGATE_MEASURE_ENABLED:-false}
  RESTART_ONLINE_STREAMS_ON_STARTUP: 'true'
  LEGACY_SINGLE_ACTIVE_CAMERA: 'false'
  PIPELINE_FRAME_TIMEOUT_SEC: '15.0'
  RTSP_HWACCEL: ${RTSP_HWACCEL:-cuda}
  RTSP_INGEST_BACKEND: ${RTSP_INGEST_BACKEND:-pyav}
  TENSORRT_ENABLED: ${TENSORRT_ENABLED:-true}
  INSIGHTFACE_RUNTIME_REPLICAS: '3'
  ATTENTION_SCHEDULING: ${ATTENTION_SCHEDULING:-true}
  AI_SHARD_INDEX: '0'
  AI_SHARD_COUNT: '1'
  AI_SHARD_PRIMARY_OWNS_CAMERAS: 'true'
  INFER_SERVICE_URL: ''
  VMS_INGEST_POOL_SIZE: '48'
  PYTHON_SWITCH_INTERVAL: '0'
  PYTHONFAULTHANDLER: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  WATCHFILES_FORCE_POLLING: 'true'
x-ai-volumes: &id002
- ./ai/face-service/vms_face:/srv/app/face_detection/vms_face
- ./models/insightface:/root/.insightface
- ./data/ai-models:/srv/data/models:ro
# The person-detection weights, where PIPELINE_PERSON_MODEL_PATH can reach
# them. They used to be addressed under /srv/data/models, which is mounted
# from ./data/ai-models -- a runtime directory holding only .gitkeep. So
# enabling PIPELINE_PERSON_DETECTION_ENABLED found no model, logged a warning
# and silently fell back to face-only counting, which looks identical to the
# feature being off. Same source zone-guard already mounts (see its service).
- ./models/person:/srv/data/person-models:ro
- ./data/known-faces:/srv/data/known_faces:ro
- vms-locks:/vms-locks
- ${RECORDINGS_DIR:-./data/recordings}:/recordings:ro
x-ai-service:
  build: &id003
    context: ./ai/face-service
  image: drishyam/face-service:latest
  restart: unless-stopped
  environment: *id001
  volumes: *id002
services:
  mysql:
    image: mysql:8.4
    container_name: drishyam-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: drishyamvms
      MYSQL_ALLOW_EMPTY_PASSWORD: ${MYSQL_ALLOW_EMPTY_PASSWORD:-yes}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
    ports:
    - 127.0.0.1:3307:3306
    volumes:
    - mysql-data:/var/lib/mysql
    healthcheck:
      test:
      - CMD-SHELL
      - mysqladmin ping -h 127.0.0.1 --silent
      interval: 10s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    container_name: drishyam-redis
    restart: unless-stopped
    command:
    - sh
    - -c
    - exec redis-server --requirepass "${REDIS_PASSWORD:-}"
    ports:
    - 127.0.0.1:${REDIS_HOST_PORT:-6379}:6379
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli ${REDIS_PASSWORD:+-a ${REDIS_PASSWORD}} ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 20
  postgres:
    image: pgvector/pgvector:pg16
    container_name: drishyam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vms}
      POSTGRES_DB: vms_face
    ports:
    - 127.0.0.1:5432:5432
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-vms} -d vms_face
      interval: 10s
      timeout: 5s
      retries: 20
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: drishyam-qdrant
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    ports:
    - 127.0.0.1:6333:6333
    - 127.0.0.1:6334:6334
    volumes:
    - qdrant-data:/qdrant/storage
  minio:
    image: bitnamilegacy/minio:2024.10.13
    container_name: drishyam-minio
    restart: unless-stopped
    entrypoint:
    - /opt/bitnami/minio/bin/minio
    command:
    - server
    - /data
    - --console-address
    - :9001
    user: 0:0
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
    - 127.0.0.1:9000:9000
    - 127.0.0.1:9001:9001
    volumes:
    - minio-data:/data
  kafka:
    image: apache/kafka:3.9.0
    container_name: drishyam-kafka
    restart: unless-stopped
    ports:
    - 127.0.0.1:9092:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
    - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list ||
        exit 1
      interval: 15s
      timeout: 10s
      retries: 20
  stream-service:
    build:
      context: ./media/stream-service
    image: drishyam/stream-service:1.18.1
    container_name: drishyam-stream-service
    restart: unless-stopped
    networks:
      default:
        aliases:
        - mediamtx
    environment:
      MTX_WEBRTCADDITIONALHOSTS: 127.0.0.1,localhost,${HOST_IP:-127.0.0.1}
    ports:
    - 127.0.0.1:9997:9997
    - 127.0.0.1:9998:9998
    - 8554:8554
    - ${BIND_ADDR:-0.0.0.0}:8898:8888
    - ${BIND_ADDR:-0.0.0.0}:8889:8889
    - 8189:8189/udp
    - ${BIND_ADDR:-0.0.0.0}:8890:8890
    volumes:
    - ./media/stream-service/mediamtx.yml:/mediamtx.yml:ro
    - ${RECORDINGS_DIR:-./data/recordings}:/recordings
    extra_hosts:
    - host.docker.internal:host-gateway
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
  smart-cam-backend:
    build:
      context: ./backend
    container_name: drishyam-backend
    restart: unless-stopped
    env_file:
    - ./backend/.env
    command:
    - sh
    - -c
    - npx sequelize-cli db:migrate && (npx sequelize-cli db:seed:all || true) && npx
      nodemon src/server.js
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: drishyamvms
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      REDIS_URL: redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      AI_SERVICE_URL: http://smart-cam-ai:8001
      ACTIVITY_SERVICE_URL: http://activity-monitor:8000
      FACE_RECONSTRUCT_BASE: http://face-reconstruct:8002
      SMART_CAM_TRANSCODER_URL: http://smart-cam-transcoder:8004
      PERSON_TRACKER_URL: http://person-tracker:8003
      PERSON_TRACKER_SERVICE_TOKEN: ${SERVICE_TOKEN}
      STREAM_SERVICE_API_URL: http://stream-service:9997
      MEDIAMTX_API_URL: http://stream-service:9997
      STREAM_SERVICE_INTERNAL_HLS_URL: http://stream-service:8888
      STREAM_SERVICE_HLS_URL: ${PUBLIC_HLS_URL:-http://localhost:8898}
      STREAM_SERVICE_WEBRTC_URL: ${PUBLIC_WEBRTC_URL:-http://localhost:8889}
      STREAM_SERVICE_RTSP_HOST: stream-service
      STREAM_SERVICE_RECORDINGS_DIR: /recordings
      RECORD_SUB: '0'
      TRANSCODER_ALLOW_HW: 'true'
      TRANSCODER_MAX: '24'
      SOURCE_CLOSE_AFTER: 5m
      RELAY_AUDIO: ${RELAY_AUDIO:-0}
      RATE_LIMIT_SKIP_PRIVATE: '1'
      SUPERVISOR_FLAP_LIMIT: '4'
      SUPERVISOR_FLAP_WINDOW_MS: '120000'
      SUPERVISOR_QUARANTINE_MS: '600000'
      FRONTEND_URL: ${PUBLIC_APP_URL:-http://localhost:5173}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      CHOKIDAR_USEPOLLING: 'true'

    ports:
    - ${BIND_ADDR:-0.0.0.0}:5000:5000
    volumes:
    - ./backend:/app
    - backend-node-modules:/app/node_modules
    - ${RECORDINGS_DIR:-./data/recordings}:/recordings
   
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - require('http').get('http://127.0.0.1:5000/api/health/live',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      stream-service:
        condition: service_started
  smart-cam-app:
    build:
      context: ./frontend
    container_name: drishyam-app
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:5000}
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
    ports:
    - ${BIND_ADDR:-0.0.0.0}:5173:5173
    volumes:
    - ./frontend:/app
    - app-node-modules:/app/node_modules
    depends_on:
      smart-cam-backend:
        condition: service_started
  smart-cam-ai:
    build: *id003
    image: drishyam/face-service:latest
    restart: unless-stopped
    environment: *id001
    volumes: *id002
    container_name: drishyam-ai
    command:
    - sh
    - -c
    - alembic upgrade head && uvicorn vms_face.api.main:app --host 0.0.0.0 --port
      8001
    ports:
    - ${BIND_ADDR:-0.0.0.0}:8001:8001
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/healthz',timeout=4).status==200
        else 1)
      interval: 30s
      timeout: 6s
      retries: 5
      start_period: 300s
    depends_on:
      smart-cam-backend:
        condition: service_started
      stream-service:
        condition: service_started
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      kafka:
        condition: service_started
  smart-cam-ai-worker:
    build: *id003
    image: drishyam/face-service:latest
    restart: unless-stopped
    environment: *id001
    volumes: *id002
    container_name: drishyam-ai-worker
    command:
    - python
    - -m
    - vms_face.workers.match_worker
    depends_on:
      smart-cam-ai:
        condition: service_started
  journey-stitch-worker:
    image: drishyam/face-service:latest
    container_name: drishyam-journey-stitch-worker
    restart: unless-stopped
    command:
    - python
    - -m
    - vms_face.workers.stitch_worker
    volumes: *id002
    environment:
      BACKEND_URL: http://smart-cam-backend:5000
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      VMS_JWT_SECRET: ${SERVICE_TOKEN}
      VMS_CAMERA_CRED_KEY: ${VMS_CAMERA_CRED_KEY:-}
      LEGACY_API_KEY: ${LEGACY_API_KEY:-}
      VMS_ENV: ${VMS_ENV:-dev}
      VMS_JWT_DEV_BYPASS: ${VMS_JWT_DEV_BYPASS:-true}
      MEDIAMTX_RTSP_HOST: mediamtx
      MEDIAMTX_RTSP_PORT: 8554
      MEDIAMTX_RTSP_TEMPLATE: rtsp://{host}:{port}/cam_{monitor_id}
      PORT: 8001
      API_PORT: 8001
      POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-vms}:${POSTGRES_PASSWORD:-vms}@postgres:5432/vms_face
      POSTGRES_DSN_SYNC: postgresql+psycopg2://${POSTGRES_USER:-vms}:${POSTGRES_PASSWORD:-vms}@postgres:5432/vms_face
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      REDIS_URL: redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET_OUTPUT: vms-person-tracker
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RECORDINGS_ROOT: /recordings
      TZ: ${TZ:-Asia/Kolkata}
      KNOWN_FACES_DIR: /srv/data/known_faces
      DEFAULT_TENANT_NAME: ${AI_DEFAULT_TENANT_NAME:-drisyam-default}
      INSIGHTFACE_MODEL: buffalo_l
      INSIGHTFACE_DET_SIZE: 960
      INSIGHTFACE_CTX_ID: 0
      INSIGHTFACE_PROVIDERS: CUDAExecutionProvider,CPUExecutionProvider
      INSIGHTFACE_DET_THRESHOLD: '0.5'
      INSIGHTFACE_REC_THRESHOLD: '0.45'
      RECOGNIZER_BACKEND: insightface_batched
      PIPELINE_BATCHED_INFERENCE: 'true'
      INSIGHTFACE_DET_ASPECT: '1.7778'
      DETECT_EVERY_N_FRAMES: '2'
      MOTION_GATE_ENABLED: 'true'
      MATCH_MIN_FACE_PX: '15'
      MATCH_MIN_QUALITY: '0.25'
      MATCH_MIN_BLUR_VAR: '8.0'
      TRACK_MIN_HITS_TO_MATCH: '2'
      FACE_LEARNING_MIN_SIMILARITY: '0.50'
      FACE_LEARNING_MIN_QUALITY: '0.45'
      FACE_LEARNING_MIN_FACE_PX: '60'
      FACE_LEARNING_MIN_BLUR_VAR: '20.0'
      JOURNEY_BODY_LOGGING: 'true'
      PIPELINE_PERSON_DETECTION_ENABLED: ${PIPELINE_PERSON_DETECTION_ENABLED:-false}
      PIPELINE_PERSON_MODEL_PATH: /srv/data/person-models/yolov8n.onnx
      PIPELINE_PERSON_THRESHOLD: '0.35'
      PIPELINE_PERSON_DET_SIZE: '640'
      PIPELINE_PERSON_DETECT_EVERY_N_FRAMES: ${PIPELINE_PERSON_DETECT_EVERY_N_FRAMES:-2}
      INVESTIGATE_MEASURE_ENABLED: ${INVESTIGATE_MEASURE_ENABLED:-false}
      RESTART_ONLINE_STREAMS_ON_STARTUP: 'true'
      LEGACY_SINGLE_ACTIVE_CAMERA: 'false'
      PIPELINE_FRAME_TIMEOUT_SEC: '15.0'
      RTSP_HWACCEL: ${RTSP_HWACCEL:-cuda}
      RTSP_INGEST_BACKEND: ${RTSP_INGEST_BACKEND:-pyav}
      TENSORRT_ENABLED: ${TENSORRT_ENABLED:-true}
      INSIGHTFACE_RUNTIME_REPLICAS: '3'
      ATTENTION_SCHEDULING: ${ATTENTION_SCHEDULING:-true}
      AI_SHARD_INDEX: '0'
      AI_SHARD_COUNT: '1'
      AI_SHARD_PRIMARY_OWNS_CAMERAS: 'true'
      INFER_SERVICE_URL: ''
      VMS_INGEST_POOL_SIZE: '48'
      PYTHON_SWITCH_INTERVAL: '0'
      PYTHONFAULTHANDLER: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      WATCHFILES_FORCE_POLLING: 'true'
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      CLIP_PAD_BEFORE_SEC: '2'
      CLIP_PAD_AFTER_SEC: '4'
      STITCH_MAX_TOTAL_SEC: '600'
      PYTHONUNBUFFERED: '1'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      kafka:
        condition: service_started
  head-count:
    build:
      context: ./ai/head-count
      dockerfile: Dockerfile
    image: drishyam/head-count:latest
    container_name: drishyam-head-count
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      BACKEND_URL: http://smart-cam-backend:5000
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      OPENCV_FFMPEG_CAPTURE_OPTIONS: rtsp_transport;tcp
      HEADCOUNT_FORWARD__ENABLED: 'true'
    volumes:
    - ./ai/head-count/config:/srv/head-count/config
    - ./ai/head-count/models:/srv/head-count/models
    ports:
    - ${BIND_ADDR:-0.0.0.0}:8020:8000
    depends_on:
      smart-cam-backend:
        condition: service_started
      stream-service:
        condition: service_started
  zone-guard:
    image: drishyam/head-count:latest
    container_name: drishyam-zone-guard
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      BACKEND_URL: http://smart-cam-backend:5000
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      OPENCV_FFMPEG_CAPTURE_OPTIONS: rtsp_transport;tcp
      ZONE_SIM_MONITORS: ${ZONE_GUARD_MONITORS:-none}
      ZONE_SIM_SOURCES: ${ZONE_GUARD_SOURCES:-}
      ZONE_SIM_MODEL: /models/yolov8n.pt
      ZONE_SIM_FPS: '4'
      ZONE_SIM_CONF: '0.35'
    entrypoint:
    - python
    - -u
    - /srv/zone-guard/zone_sim.py
    volumes:
    - ./ai/zone-guard:/srv/zone-guard:ro
    - ./models/person/yolov8n.pt:/models/yolov8n.pt:ro
    depends_on:
      head-count:
        condition: service_started
      smart-cam-backend:
        condition: service_started
  activity-monitor:
    build:
      context: ./ai/activity-monitor
    image: drishyam/activity-monitor:latest
    container_name: drishyam-activity-monitor
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      OPENCV_FFMPEG_CAPTURE_OPTIONS: rtsp_transport;tcp
      RECOGNITION_PG_DSN: postgresql://${POSTGRES_USER:-vms}:${POSTGRES_PASSWORD:-vms}@postgres:5432/vms_face
      RECOGNITION_SESSION_GAP_SEC: '3600'
      RECOGNITION_MIN_DETECTIONS: '3'
      RECOGNITION_ENTRY_CAMERAS: ${ACTIVITY_ENTRY_CAMERAS:-}
      RECOGNITION_MIN_SIMILARITY: '0.5'
      RECOGNITION_BREAK_GAP_SEC: '900'
      ALERTS_ENABLED: '1'
      ALERT_BUSINESS_HOURS: ${ACTIVITY_BUSINESS_HOURS:-07:00-21:00}
      ALERT_STRANGER_DWELL_SEC: '180'
      ALERT_STRANGER_AFTER_HOURS_ONLY: '1'
      ALERT_WATCHLIST: ${ACTIVITY_ALERT_WATCHLIST:-}
    volumes:
    - ./ai/activity-monitor/config:/srv/activity-monitor/config
    - activity-monitor-data:/srv/activity-monitor/data
    ports:
    - ${BIND_ADDR:-0.0.0.0}:8010:8000
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      stream-service:
        condition: service_started
  face-reconstruct:
    profiles:
    - enhance
    build:
      context: ./ai/face-reconstruct
    image: drishyam/face-reconstruct:latest
    container_name: drishyam-face-reconstruct
    restart: unless-stopped
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      PYTHONUNBUFFERED: '1'
    ports:
    - 8002:8002
    volumes:
    - ./ai/face-reconstruct/backend:/srv/backend
    - ./models/face-reconstruct:/srv/CodeFormer/weights
  smart-cam-transcoder:
    profiles:
    - media
    build:
      context: ./media/transcoder
    container_name: drishyam-transcoder
    restart: unless-stopped
    environment:
      PORT: 8004
      MEDIAMTX_RTSP_BASE: rtsp://mediamtx:8554
      MEDIAMTX_API_URL: http://mediamtx:9997
      MEDIAMTX_API_USER: ${STREAM_API_USER:-drishyam}
      MEDIAMTX_API_PASS: ${STREAM_API_PASS:-drishyam123}
      CLEAN_PATH_SUFFIX: _clean
      NVENC_CODEC: h264_nvenc
      NVENC_PRESET: p4
      NVENC_TUNE: ll
      NVENC_PROFILE: baseline
      NVENC_BITRATE_KBPS: '4000'
      NVENC_MAXRATE_KBPS: '5000'
      NVENC_GOP_SECONDS: '2.0'
      NVENC_FPS: '25'
      NVENC_AUDIO: copy
      MAX_CONCURRENT_TRANSCODERS: '16'
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      PYTHONUNBUFFERED: '1'
    ports:
    - 8004:8004
    volumes:
    - ./media/transcoder/app:/app/app
    depends_on:
      stream-service:
        condition: service_started
  smart-cam-sfu-bridge:
    profiles:
    - media
    build:
      context: ./media/sfu-bridge
    container_name: drishyam-sfu-bridge
    restart: unless-stopped
    environment:
      PORT: 8005
      MEDIAMTX_RTSP_BASE: rtsp://mediamtx:8554
      CLEAN_PATH_SUFFIX: _clean
      LIVEKIT_URL: ${LIVEKIT_WS_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_PUBLISH_TTL_SEC: '3600'
      MAX_CONCURRENT_PUBLISHERS: '100'
      PYTHONUNBUFFERED: '1'
    ports:
    - 8005:8005
    volumes:
    - ./media/sfu-bridge/app:/app/app
    depends_on:
      stream-service:
        condition: service_started
  local-demo-cam:
    profiles:
    - demo
    image: drishyam/face-service:latest
    container_name: drishyam-demo-cam
    restart: unless-stopped
    entrypoint:
    - sh
    - -c
    - "while true; do\n  # Re-encoded (not -c copy): a short GOP so late joiners get\
      \ a keyframe.\n  ffmpeg -hide_banner -loglevel warning -re -stream_loop -1 -fflags\
      \ +genpts \\\n    -i /demo/crowd.mp4 -an -c:v libx264 -preset veryfast -bf 0\
      \ -profile:v baseline \\\n    -pix_fmt yuv420p -g 30 -f rtsp -rtsp_transport\
      \ tcp rtsp://stream-service:8554/demo_src\n  echo \"demo publisher exited; restarting\
      \ in 3s\"; sleep 3\ndone\n"
    volumes:
    - ./demo/videos/crowd.mp4:/demo/crowd.mp4:ro
    depends_on:
      stream-service:
        condition: service_started
  footfall-demo:
    profiles:
    - demo
    image: drishyam/face-service:latest
    container_name: drishyam-footfall-demo
    restart: unless-stopped
    entrypoint:
    - python
    - /demo/footfall_publisher.py
    environment:
      AI_BASE: http://smart-cam-ai:8001
      MEDIAMTX_HOST: mediamtx
      MEDIAMTX_RTSP_PORT: '8554'
      DEMO_CAMERA_CODE: demo-entrance
      DEMO_VIDEO: /demo/footfall.mp4
      DEMO_LINE_Y_FRAC: '0.5'
      DEMO_DIRECTION: down_is_in
      DEMO_TARGET_FPS: '8'
    volumes:
    - ./demo/footfall_publisher.py:/demo/footfall_publisher.py:ro
    - ./demo/videos/FootfallVideo.mp4:/demo/footfall.mp4:ro
    depends_on:
      stream-service:
        condition: service_started
      smart-cam-ai:
        condition: service_started
  cloudflared:
    profiles:
    - tunnel
    image: cloudflare/cloudflared:2025.5.0
    container_name: drishyam-cloudflared
    restart: unless-stopped
    command:
    - tunnel
    - --config
    - /etc/cloudflared/${CLOUDFLARED_CONFIG:-config.yml}
    - run
    volumes:
    - ${CLOUDFLARED_DIR:-./deploy/cloudflared/credentials}:/etc/cloudflared:ro
    depends_on:
      smart-cam-backend:
        condition: service_started
volumes:
  vms-locks: null
  mysql-data: null
  postgres-data: null
  qdrant-data: null
  minio-data: null
  kafka-data: null
  app-node-modules: null
  backend-node-modules: null
  activity-monitor-data: null
